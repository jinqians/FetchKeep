<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="FetchKeep Lite">
  <title>FetchKeep Lite</title>
  <!--
    One silhouette carrying both halves of the name.

    The top is a tag with a slot — things go in there and stay: Keep.
    The bottom converges to a point, an arrowhead aimed the way the file
    travelled: Fetch.

    Drawn as a single path with fill-rule="evenodd" so the slot is a real hole
    rather than a shape painted in the background colour. That is what lets the
    mark sit on any ground, and it is why it survives being 16px in a browser tab:
    one solid form, one hole, no strokes to disappear.
  -->
  <path fill="currentColor" fill-rule="evenodd" d="
    M9 4.5 H23 A2 2 0 0 1 25 6.5 V19.6 L16 28.4 L7 19.6 V6.5 A2 2 0 0 1 9 4.5 Z
    M12.8 8.8 H19.2 A1.3 1.3 0 0 1 19.2 11.4 H12.8 A1.3 1.3 0 0 1 12.8 8.8 Z
  "/>
</svg>
